<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Admin-Bereich - Community Rankings</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 20px; background: #fdfbf7; color: #333; }
        .nav-links { margin-bottom: 25px; }
        .btn-back { display: inline-block; padding: 8px 16px; background: #6c757d; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .btn-back:hover { background: #5a6268; }

        h2 { border-bottom: 2px solid #ddd; padding-bottom: 8px; margin-top: 40px; }
        
        .card { border: 1px solid #ddd; padding: 15px; margin-bottom: 15px; border-radius: 8px; background: #ffffff; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .card h3 { margin: 0; }
        
        .actions { display: flex; gap: 10px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
        select, button { padding: 8px 12px; border-radius: 5px; border: 1px solid #ccc; font-size: 14px; }
        button { cursor: pointer; font-weight: bold; }
        
        .btn-approve { background: #28a745; color: white; border: none; }
        .btn-approve:hover { background: #218838; }
        .btn-reject { background: #dc3545; color: white; border: none; }
        .btn-reject:hover { background: #c82333; }
        .btn-delete { background: #343a40; color: white; border: none; }
        .btn-delete:hover { background: #23272b; }

        .reports-box { margin-top: 15px; background: #fff3cd; border: 1px solid #ffeeba; padding: 10px; border-radius: 5px; font-size: 13px; }
        .reports-box h4 { margin: 0 0 8px 0; color: #856404; }
        .report-item { background: #fff; padding: 6px 10px; margin-bottom: 6px; border-radius: 4px; border-left: 3px solid #ffc107; display: flex; justify-content: space-between; align-items: center; }
        .report-date { font-size: 11px; color: #666; margin-left: 10px; }
    </style>
</head>
<body>

    <div class="nav-links">
        <a href="index.html" class="btn-back">← Zurück zur Startseite</a>
    </div>

    <h1>Admin-Bereich ⚙️</h1>

    <h2>Ausstehende Anträge</h2>
    <div id="pendingList">Lade ausstehende Anträge...</div>

    <h2>Freigegebene Einträge</h2>
    <div id="approvedList">Lade freigegebene Einträge...</div>

    <script type="module">
        import { db } from './app.js';
        import { collection, getDocs, doc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const pendingList = document.getElementById('pendingList');
        const approvedList = document.getElementById('approvedList');

        async function loadAdminData() {
            try {
                const q = query(collection(db, "submissions"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                
                let pendingHTML = "";
                let approvedHTML = "";
                let hasPending = false;
                let hasApproved = false;

                querySnapshot.forEach((docItem) => {
                    const data = docItem.data();
                    const id = docItem.id;
                    const mainCat = data.mainCategory || 'Dom';
                    const category = data.category || 'ungeprüft';
                    const links = data.profileLinks ? data.profileLinks.join(', ') : '';

                    let reportsHTML = "";
                    if (data.reports && data.reports.length > 0) {
                        // Korrigierte Sortierung (neueste Berichte zuerst)
                        const sortedReports = [...data.reports].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                        reportsHTML = `
                            <div class="reports-box">
                                <h4>⚠️ Anmerkungen / Meldungen (${sortedReports.length}):</h4>
                                ${sortedReports.map(r => `
                                    <div class="report-item">
                                        <span>${r.message}</span>
                                        <span class="report-date">${r.createdAt ? new Date(r.createdAt).toLocaleString('de-DE') : ''}</span>
                                    </div>
                                `).join('')}
                            </div>
                        `;
                    }

                    if (data.status === "pending") {
                        hasPending = true;
                        pendingHTML += `
                            <div class="card">
                                <div class="card-header">
                                    <h3>${data.username}</h3>
                                    <span>Eingereicht am: ${data.createdAt ? new Date(data.createdAt).toLocaleString('de-DE') : 'Unbekannt'}</span>
                                </div>
                                <p><strong>Haupt-Kategorie:</strong> ${mainCat} | <strong>Status-Kategorie:</strong> ${category}</p>
                                <p><strong>Links:</strong> <a href="${links}" target="_blank">${links}</a></p>
                                
                                <div class="actions">
                                    <button class="btn-approve" onclick="updateStatus('${id}', 'approved')">Freigeben</button>
                                    <button class="btn-reject" onclick="deleteSubmission('${id}')">Ablehnen / Löschen</button>
                                </div>
                            </div>
                        `;
                    } else if (data.status === "approved") {
                        hasApproved = true;
                        approvedHTML += `
                            <div class="card">
                                <div class="card-header">
                                    <h3>${data.username}</h3>
                                    <span>Erstellt: ${data.createdAt ? new Date(data.createdAt).toLocaleString('de-DE') : 'Unbekannt'}</span>
                                </div>
                                <p><strong>Links:</strong> <a href="${links}" target="_blank">${links}</a></p>
                                
                                <div class="actions">
                                    <label>Haupt-Kategorie:</label>
                                    <select onchange="updateMainCategory('${id}', this.value)">
                                        <option value="Dom" ${mainCat === 'Dom' ? 'selected' : ''}>Dom</option>
                                        <option value="Sub" ${mainCat === 'Sub' ? 'selected' : ''}>Sub</option>
                                    </select>

                                    <label>Status:</label>
                                    <select onchange="updateCategory('${id}', this.value)">
                                        <option value="ungeprüft" ${category === 'ungeprüft' ? 'selected' : ''}>ungeprüft</option>
                                        <option value="Echt" ${category === 'Echt' ? 'selected' : ''}>Echt</option>
                                        <option value="Zeitverschwendung" ${category === 'Zeitverschwendung' ? 'selected' : ''}>Zeitverschwendung</option>
                                    </select>

                                    <button class="btn-delete" onclick="deleteSubmission('${id}')">Löschen</button>
                                </div>
                                ${reportsHTML}
                            </div>
                        `;
                    }
                });

                pendingList.innerHTML = hasPending ? pendingHTML : "<p>Keine ausstehenden Anträge vorhanden.</p>";
                approvedList.innerHTML = hasApproved ? approvedHTML : "<p>Keine freigegebenen Einträge vorhanden.</p>";

            } catch (error) {
                pendingList.textContent = "Fehler beim Laden der Admin-Daten.";
                approvedList.textContent = "";
                console.error(error);
            }
        }

        window.updateStatus = async function(id, newStatus) {
            try {
                const docRef = doc(db, "submissions", id);
                await updateDoc(docRef, { status: newStatus });
                loadAdminData();
            } catch (error) {
                alert("Fehler: " + error.message);
            }
        };

        window.updateMainCategory = async function(id, newMainCat) {
            try {
                const docRef = doc(db, "submissions", id);
                await updateDoc(docRef, { mainCategory: newMainCat });
            } catch (error) {
                alert("Fehler beim Ändern der Haupt-Kategorie: " + error.message);
            }
        };

        window.updateCategory = async function(id, newCat) {
            try {
                const docRef = doc(db, "submissions", id);
                await updateDoc(docRef, { category: newCat });
            } catch (error) {
                alert("Fehler beim Ändern der Kategorie: " + error.message);
            }
        };

        window.deleteSubmission = async function(id) {
            if (confirm("Möchtest du diesen Eintrag wirklich unwiderruflich löschen?")) {
                try {
                    await deleteDoc(doc(db, "submissions", id));
                    loadAdminData();
                } catch (error) {
                    alert("Fehler beim Löschen: " + error.message);
                }
            }
        };

        loadAdminData();
    </script>
</body>
</html>
