<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Admin - Moderation & Verwaltung</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 20px; background: #fdfbf7; color: #333; }
        .nav-back { margin-bottom: 20px; }
        .btn-back { display: inline-block; padding: 8px 15px; background: #6c757d; color: white; text-decoration: none; border-radius: 5px; font-size: 14px; font-weight: bold; }
        .btn-back:hover { background: #5a6268; }
        .admin-card { border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; border-radius: 8px; background: #fffdf5; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .admin-card img { max-width: 120px; display: block; margin-bottom: 10px; border-radius: 4px; }
        input, select, button { padding: 8px; margin-right: 5px; margin-bottom: 10px; }
        .btn-approve { background: #28a745; color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .btn-delete { background: #dc3545; color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; }
        
        /* Farbliche Markierungen für die Badges */
        .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; color: white; font-weight: bold; font-size: 12px; }
        .bg-zeitverschwendung { background: #dc3545; } /* Rot */
        .bg-ungeprueft { background: #fd7e14; }      /* Orange */
        .bg-echt { background: #28a745; }           /* Grün */
        .bg-nicht-echt { background: #dc3545; }     /* Rot */

        #loginSection, #adminSection { display: none; }
        .section-title { margin-top: 30px; border-bottom: 2px solid #333; padding-bottom: 5px; }
        #loadingAuth { text-align: center; font-weight: bold; color: #666; margin-top: 50px; }
    </style>
</head>
<body>

    <div class="nav-back">
        <a href="index.html" class="btn-back">← Zurück zur Startseite</a>
    </div>

    <div id="loadingAuth">Überprüfe Anmelde-Status...</div>

    <!-- Login Formular -->
    <div id="loginSection">
        <h2>Admin Login</h2>
        <input type="email" id="email" placeholder="E-Mail"><br><br>
        <input type="password" id="password" placeholder="Passwort"><br><br>
        <button id="loginBtn" class="btn-approve" style="padding: 10px 20px;">Einloggen</button>
        <p id="loginError" style="color: red; font-weight: bold;"></p>
    </div>

    <!-- Admin Dashboard -->
    <div id="adminSection">
        <button id="logoutBtn" class="btn-delete" style="float: right;">Abmelden</button>
        <h1>Admin Dashboard</h1>

        <h2 class="section-title">Offene Einsendungen zur Prüfung</h2>
        <div id="pendingList">Lade offene Einsendungen...</div>

        <h2 class="section-title">Bereits veröffentlichte Einträge</h2>
        <div id="approvedList">Lade veröffentlichte Einträge...</div>
    </div>

    <script type="module">
        import { auth, db, collection, getDocs, doc, updateDoc, deleteDoc, query, where, signInWithEmailAndPassword, onAuthStateChanged, signOut } from './app.js';

        const loadingAuth = document.getElementById('loadingAuth');
        const loginSection = document.getElementById('loginSection');
        const adminSection = document.getElementById('adminSection');
        const loginError = document.getElementById('loginError');

        onAuthStateChanged(auth, (user) => {
            loadingAuth.style.display = 'none';
            if (user) {
                loginSection.style.display = 'none';
                adminSection.style.display = 'block';
                loadAllSubmissions();
            } else {
                loginSection.style.display = 'block';
                adminSection.style.display = 'none';
            }
        });

        document.getElementById('loginBtn').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            loginError.textContent = "";

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                console.error("Login-Fehler:", error);
                loginError.textContent = "Login fehlgeschlagen: " + error.message;
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

        async function loadAllSubmissions() {
            loadPending();
            loadApproved();
        }

        // 1. Offene Einträge laden
        async function loadPending() {
            const pendingList = document.getElementById('pendingList');
            try {
                const q = query(collection(db, "submissions"), where("status", "==", "pending"));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    pendingList.innerHTML = "<p>Keine offenen Einsendungen vorhanden.</p>";
                    return;
                }

                let html = '';
                querySnapshot.forEach((document) => {
                    const data = document.data();
                    html += `
                        <div class="admin-card" id="card-${document.id}">
                            <img src="${data.imageUrl}" alt="">
                            <h3>${data.username}</h3>
                            <p><a href="${data.profileLinks[0]}" target="_blank">Profil-Link öffnen</a></p>
                            
                            <label><strong>Kategorie wählen:</strong></label><br>
                            <select id="category-${document.id}">
                                <option value="ungeprüft">ungeprüft</option>
                                <option value="Echt">Echt</option>
                                <option value="nicht Echt">nicht Echt</option>
                                <option value="Zeitverschwendung">Zeitverschwendung</option>
                            </select><br>

                            <label>Bewertung (Punkte):</label>
                            <input type="number" id="rating-${document.id}" placeholder="z.B. 8.5"><br>

                            <button class="btn-approve" onclick="window.approveItem('${document.id}')">Freigeben</button>
                            <button class="btn-delete" onclick="window.deleteItem('${document.id}')">Löschen</button>
                        </div>
                    `;
                });
                pendingList.innerHTML = html;
            } catch (error) {
                pendingList.textContent = "Fehler beim Laden der offenen Einträge.";
                console.error(error);
            }
        }

        // 2. Bereits freigegebene Einträge laden
        async function loadApproved() {
            const approvedList = document.getElementById('approvedList');
            try {
                const q = query(collection(db, "submissions"), where("status", "==", "approved"));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    approvedList.innerHTML = "<p>Keine veröffentlichten Einträge vorhanden.</p>";
                    return;
                }

                let html = '';
                querySnapshot.forEach((document) => {
                    const data = document.data();
                    
                    // Klasse für die jeweilige Badge-Farbe bestimmen
                    let badgeClass = "bg-ungeprueft";
                    const cat = data.category || "ungeprüft";
                    if (cat === "Zeitverschwendung" || cat === "nicht Echt") badgeClass = "bg-zeitverschwendung";
                    if (cat === "Echt") badgeClass = "bg-echt";

                    html += `
                        <div class="admin-card" id="card-${document.id}" style="background: #f0fff0;">
                            <img src="${data.imageUrl}" alt="">
                            <h3>${data.username}</h3>
                            <p><strong>Kategorie:</strong> <span class="badge ${badgeClass}">${cat}</span></p>
                            <p><strong>Bewertung:</strong> ${data.rating !== null && data.rating !== undefined ? data.rating + ' Punkte' : 'Keine'}</p>
                            <button class="btn-delete" onclick="window.deleteItem('${document.id}')">Eintrag unwiderruflich löschen</button>
                        </div>
                    `;
                });
                approvedList.innerHTML = html;
            } catch (error) {
                approvedList.textContent = "Fehler beim Laden der freigegebenen Einträge.";
                console.error(error);
            }
        }

        // Funktion: Freigeben mit Kategorie
        window.approveItem = async function(id) {
            const category = document.getElementById(`category-${id}`).value;
            const ratingInput = document.getElementById(`rating-${id}`).value;
            const rating = ratingInput ? parseFloat(ratingInput) : 0;

            try {
                const docRef = doc(db, "submissions", id);
                await updateDoc(docRef, {
                    status: "approved",
                    category: category,
                    rating: rating
                });
                alert("Erfolgreich freigegeben!");
                loadAllSubmissions();
            } catch (error) {
                alert("Fehler beim Freigeben: " + error.message);
            }
        };

        // Funktion: Endgültig löschen
        window.deleteItem = async function(id) {
            if (confirm("Möchtest du diesen Eintrag wirklich dauerhaft löschen?")) {
                try {
                    await deleteDoc(doc(db, "submissions", id));
                    alert("Eintrag gelöscht!");
                    loadAllSubmissions();
                } catch (error) {
                    alert("Fehler beim Löschen: " + error.message);
                }
            }
        };
    </script>
</body>
</html>
