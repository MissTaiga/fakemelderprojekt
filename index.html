<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Community Rankings</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; background: #fdfbf7; color: #333; }
        .nav-links { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .btn-primary { display: inline-block; padding: 10px 20px; background: #0066cc; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .btn-primary:hover { background: #0051a2; }
        .admin-link { color: #666; text-decoration: none; font-size: 14px; }
        .admin-link:hover { text-decoration: underline; }
        #search { width: 100%; padding: 12px; font-size: 16px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; }
        
        #notFoundContainer { display: none; margin-top: 10px; padding: 12px; background: #fff3cd; border: 1px solid #ffeeba; border-radius: 5px; text-align: center; }
        #notFoundContainer a { color: #856404; font-weight: bold; text-decoration: underline; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-top: 25px; }
        .card { border: 1px solid #ddd; padding: 15px; border-radius: 8px; text-align: center; background: #ffffff; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .card h3 { margin: 10px 0 5px 0; }
        .card a { color: #0066cc; text-decoration: none; display: inline-block; margin-top: 10px; }
        .card a:hover { text-decoration: underline; }

        /* Farbliche Markierungen für die Badges */
        .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; color: white; font-weight: bold; font-size: 12px; margin-top: 5px; }
        .bg-zeitverschwendung { background: #dc3545; } /* Rot */
        .bg-ungeprueft { background: #fd7e14; }      /* Orange */
        .bg-echt { background: #28a745; }           /* Grün */
        .bg-nicht-echt { background: #dc3545; }     /* Rot */
    </style>
</head>
<body>

    <!-- Navigationsleiste oben -->
    <div class="nav-links">
        <a href="submit.html" class="btn-primary">+ Neues Profil einreichen</a>
        <a href="admin.html" class="admin-link">Admin-Bereich ⚙️</a>
    </div>

    <h1>Community Rankings</h1>
    
    <!-- Suchfeld -->
    <input type="text" id="search" placeholder="Nach Benutzernamen suchen...">
    
    <!-- Dynamischer Hinweis, falls kein Treffer vorliegt -->
    <div id="notFoundContainer">
        Kein Eintrag für "<span id="missingTerm"></span>" gefunden. 
        <a id="submitLink" href="submit.html">Diesen Namen jetzt einreichen?</a>
    </div>

    <div id="gallery" class="grid">Lade Einträge...</div>

    <script type="module">
        import { db, collection, getDocs, query, where } from './app.js';

        let allSubmissions = [];
        const gallery = document.getElementById('gallery');
        const searchInput = document.getElementById('search');
        const notFoundContainer = document.getElementById('notFoundContainer');
        const missingTermSpan = document.getElementById('missingTerm');
        const submitLink = document.getElementById('submitLink');

        async function loadApprovedSubmissions() {
            try {
                const q = query(collection(db, "submissions"), where("status", "==", "approved"));
                const querySnapshot = await getDocs(q);
                
                allSubmissions = [];
                querySnapshot.forEach((doc) => {
                    allSubmissions.push({ id: doc.id, ...doc.data() });
                });

                renderGallery(allSubmissions);
            } catch (error) {
                gallery.textContent = "Fehler beim Laden der Daten.";
                console.error(error);
            }
        }

        function renderGallery(items, searchTerm = "") {
            if (items.length === 0) {
                gallery.innerHTML = "<p>Keine freigegebenen Einträge gefunden.</p>";
                
                if (searchTerm.trim() !== "") {
                    missingTermSpan.textContent = searchTerm;
                    submitLink.href = `submit.html?username=${encodeURIComponent(searchTerm)}`;
                    notFoundContainer.style.display = "block";
                } else {
                    notFoundContainer.style.display = "none";
                }
                return;
            }

            notFoundContainer.style.display = "none";
            // Hier wird bewusst KEIN Bild (<img>) mehr generiert
            gallery.innerHTML = items.map(item => {
                let badgeClass = "bg-ungeprueft";
                const cat = item.category || "ungeprüft";
                if (cat === "Zeitverschwendung" || cat === "nicht Echt") badgeClass = "bg-zeitverschwendung";
                if (cat === "Echt") badgeClass = "bg-echt";

                return `
                    <div class="card">
                        <h3>${item.username}</h3>
                        <div><span class="badge ${badgeClass}">${cat}</span></div>
                        <br>
                        <a href="${item.profileLinks[0]}" target="_blank">Zum Profil</a>
                    </div>
                `;
            }).join('');
        }

        // Live-Suche (korrigiert)
        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allSubmissions.filter(item => 
                item.username.toLowerCase().includes(term)
            );
            renderGallery(filtered, term);
        });

        loadApprovedSubmissions();
    </script>
</body>
</html>
