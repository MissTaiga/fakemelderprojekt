<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Profil einreichen</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; }
        input, button { display: block; width: 100%; margin-bottom: 15px; padding: 10px; box-sizing: border-box; }
    </style>
</head>
<body>

    <h1>Profil / Datei einreichen</h1>
    <form id="submitForm">
        <label>Benutzername:</label>
        <input type="text" id="username" required>

        <label>Profil-Link (z.B. Social Media):</label>
        <input type="url" id="profileLink" required>

        <label>Bilddatei:</label>
        <input type="file" id="imageFile" accept="image/*" required>

        <button type="submit" id="submitBtn">Absenden</button>
    </form>
    <p id="statusMsg"></p>

    <script type="module">
        import { db, collection, addDoc, serverTimestamp } from './app.js';

        const form = document.getElementById('submitForm');
        const statusMsg = document.getElementById('statusMsg');

        // Hilfsfunktion: Konvertiert das Bild in einen Base64-Textstring
        function convertFileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            statusMsg.textContent = "Wird verarbeitet...";

            try {
                const username = document.getElementById('username').value;
                const profileLink = document.getElementById('profileLink').value;
                const fileInput = document.getElementById('imageFile').files[0];

                if (!fileInput) {
                    throw new Error("Bitte wähle eine Bilddatei aus.");
                }

                // 1. Bild direkt im Browser in Base64 umwandeln
                const base64Image = await convertFileToBase64(fileInput);

                // 2. Daten direkt in Firestore speichern (Status: pending)
                await addDoc(collection(db, "submissions"), {
                    username: username,
                    profileLinks: [profileLink],
                    imageUrl: base64Image, // Hier speichern wir den Bild-Code direkt
                    status: "pending",
                    rating: null,
                    createdAt: serverTimestamp()
                });

                statusMsg.textContent = "Erfolgreich eingereicht! Wartet auf Freigabe.";
                form.reset();
            } catch (error) {
                console.error("Fehler:", error);
                statusMsg.textContent = "Fehler beim Einreichen: " + error.message;
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
