<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Profil einreichen</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; background: #fdfbf7; color: #333; }
        .nav-back { margin-bottom: 20px; }
        .btn-back { display: inline-block; padding: 8px 15px; background: #6c757d; color: white; text-decoration: none; border-radius: 5px; font-size: 14px; font-weight: bold; }
        .btn-back:hover { background: #5a6268; }
        form { background: #ffffff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border: 1px solid #ddd; }
        label { display: block; margin-top: 10px; margin-bottom: 5px; font-weight: bold; }
        input, select, button { display: block; width: 100%; margin-bottom: 15px; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #28a745; color: white; font-weight: bold; border: none; cursor: pointer; }
        button:hover { background: #218838; }
        button:disabled { background: #94d3a2; cursor: not-allowed; }
        #statusMsg { font-weight: bold; text-align: center; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="nav-back">
        <a href="index.html" class="btn-back">← Zurück zur Startseite</a>
    </div>

    <h1>Profil einreichen</h1>
    <form id="submitForm">
        <label for="mainCategory">Hauptkategorie:</label>
        <select id="mainCategory" required>
            <option value="Dom">Dom</option>
            <option value="Sub">Sub</option>
        </select>

        <label for="username">Benutzername:</label>
        <input type="text" id="username" required>

        <label for="profileLink">Profil-Link (z.B. Social Media):</label>
        <input type="url" id="profileLink" required>

        <label for="imageFile">Bilddatei (optional):</label>
        <input type="file" id="imageFile" accept="image/*">

        <button type="submit" id="submitBtn">Absenden</button>
    </form>
    <p id="statusMsg"></p>

    <script type="module">
        import { db, collection, addDoc, serverTimestamp } from './app.js';

        const urlParams = new URLSearchParams(window.location.search);
        const prefilledUsername = urlParams.get('username');
        const prefilledCategory = urlParams.get('cat');
        
        if (prefilledUsername) {
            document.getElementById('username').value = prefilledUsername;
        }
        if (prefilledCategory && (prefilledCategory === 'Dom' || prefilledCategory === 'Sub')) {
            document.getElementById('mainCategory').value = prefilledCategory;
        }

        const form = document.getElementById('submitForm');
        const statusMsg = document.getElementById('statusMsg');

        function convertFileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            statusMsg.textContent = "Wird verarbeitet...";
            statusMsg.style.color = "#333";

            try {
                const mainCategory = document.getElementById('mainCategory').value;
                const username = document.getElementById('username').value;
                const profileLink = document.getElementById('profileLink').value;
                const fileInput = document.getElementById('imageFile').files[0];

                let base64Image = null;
                if (fileInput) {
                    base64Image = await convertFileToBase64(fileInput);
                }

                await addDoc(collection(db, "submissions"), {
                    mainCategory: mainCategory,
                    username: username,
                    profileLinks: [profileLink],
                    imageUrl: base64Image,
                    status: "pending",
                    category: "ungeprüft",
                    reports: [], // Initial leeres Array für Meldungen
                    createdAt: serverTimestamp()
                });

                statusMsg.textContent = "Erfolgreich eingereicht! Wartet auf Freigabe.";
                statusMsg.style.color = "#28a745";
                form.reset();
            } catch (error) {
                console.error("Fehler:", error);
                statusMsg.textContent = "Fehler beim Einreichen: " + error.message;
                statusMsg.style.color = "#dc3545";
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
