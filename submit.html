<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Profil einreichen</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; }
        input, button { display: block; width: 100%; margin-bottom: 15px; padding: 10px; box-sizing: border-box; }
    </style>
</head>
<body>

    <h1>Profil / Datei einreichen</h1>
    <form id="submitForm">
        <label>Benutzername:</label>
        <input type="text" id="username" required>

        <label>Profil-Link (z.B. Social Media):</label>
        <input type="url" id="profileLink" required>

        <label>Bilddatei:</label>
        <input type="file" id="imageFile" accept="image/*" required>

        <button type="submit" id="submitBtn">Absenden</button>
    </form>
    <p id="statusMsg"></p>

    <script type="module">
        import { db, storage, collection, addDoc, ref, uploadBytes, getDownloadURL, serverTimestamp } from './app.js';

        const form = document.getElementById('submitForm');
        const statusMsg = document.getElementById('statusMsg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            document.getElementById('submitBtn').disabled = true;
            statusMsg.textContent = "Wird hochgeladen...";

            try {
                const username = document.getElementById('username').value;
                const profileLink = document.getElementById('profileLink').value;
                const fileInput = document.getElementById('imageFile').files[0];

                // 1. Bild in Firebase Storage hochladen
                const storageRef = ref(storage, `uploads/${Date.now()}_${fileInput.name}`);
                const snapshot = await uploadBytes(storageRef, fileInput);
                const imageUrl = await getDownloadURL(snapshot.ref);

                // 2. Daten in Firestore speichern (Status: pending)
                await addDoc(collection(db, "submissions"), {
                    username: username,
                    profileLinks: [profileLink],
                    imageUrl: imageUrl,
                    status: "pending",
                    rating: null,
                    createdAt: serverTimestamp()
                });

                statusMsg.textContent = "Erfolgreich eingereicht! Wartet auf Freigabe.";
                form.reset();
            } catch (error) {
                console.error("Fehler:", error);
                statusMsg.textContent = "Fehler beim Hochladen: " + error.message;
            } finally {
                document.getElementById('submitBtn').disabled = false;
            }
        });
    </script>
</body>
</html>
